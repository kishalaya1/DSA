# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
      working-directory: DSA
    - name: Build
      run: dotnet build --no-restore
      working-directory: DSA
    - name: Test NUnit project
      run: dotnet test ../TestDSA/TestDSA.csproj --no-build --verbosity normal
      working-directory: DSA
    - name: Test xUnit project
      run: dotnet test ../TestDSAAlt/TestDSAAlt.csproj --no-build --verbosity normal
      working-directory: DSA
